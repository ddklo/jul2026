<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#070b14"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset=".45" stop-color="#e2b45e"/>
      <stop offset="1" stop-color="#6b4614"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f3d99d"/>
      <stop offset="1" stop-color="#a87a35"/>
    </linearGradient>
  </defs>
  <!-- Bakgrunnen fyller hele flaten; telefonen runder hjørnene selv -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#fff8e6">
    <circle cx="92" cy="104" r="5" opacity=".8"/><circle cx="418" cy="132" r="4" opacity=".7"/>
    <circle cx="140" cy="420" r="3.5" opacity=".6"/><circle cx="400" cy="400" r="5" opacity=".75"/>
    <circle cx="70" cy="290" r="3" opacity=".55"/><circle cx="452" cy="268" r="3" opacity=".55"/>
  </g>
  <!-- Opphenget -->
  <path d="M256 92v36" stroke="#c9a46a" stroke-width="6" stroke-linecap="round"/>
  <rect x="226" y="124" width="60" height="40" rx="10" fill="url(#cap)"/>
  <!-- Julekulen (innenfor trygg sone for maskerbare ikoner) -->
  <circle cx="256" cy="288" r="128" fill="url(#ball)"/>
  <path d="M136 262c76 34 164 34 240 0" stroke="#b3263a" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M146 318c70 26 150 26 220 0" stroke="#b3263a" stroke-width="10" fill="none" stroke-linecap="round" opacity=".85"/>
  <ellipse cx="206" cy="226" rx="34" ry="20" fill="#fff" opacity=".45" transform="rotate(-30 206 226)"/>
</svg>
