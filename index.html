<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="Familiens juleønskelister 2026">
  <title>Juleønsker 2026</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css?v=21">
</head>
<body class="is-locked">
  <canvas id="snow" class="snow" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>

  <!-- ============ Velg ønskeliste ============ -->
  <section class="login" aria-labelledby="choose-title">
    <div class="login__card glass">
      <div class="ornament" aria-hidden="true">
        <svg viewBox="0 0 80 120">
          <defs>
            <radialGradient id="orn" cx="38%" cy="38%" r="70%">
              <stop offset="0" stop-color="#f7dfa6"/>
              <stop offset=".45" stop-color="#c9973f"/>
              <stop offset="1" stop-color="#5e3f12"/>
            </radialGradient>
          </defs>
          <line x1="40" y1="0" x2="40" y2="34" stroke="#c9a35c" stroke-width="1.2"/>
          <rect x="33" y="32" width="14" height="10" rx="2" fill="#b98d45"/>
          <circle cx="40" cy="76" r="34" fill="url(#orn)"/>
          <path d="M10 70c18 8 42 8 60 0" stroke="#7a1f2c" stroke-width="5" fill="none" opacity=".85"/>
          <path d="M8 80c20 8 44 8 64 0" stroke="#f3e3bd" stroke-width="1.2" fill="none" opacity=".6"/>
          <ellipse cx="28" cy="62" rx="8" ry="5" fill="#fff" opacity=".35" transform="rotate(-30 28 62)"/>
        </svg>
      </div>

      <p class="eyebrow">Jul 2026</p>
      <h1 id="choose-title" class="login__title">Juleønskene&nbsp;våre</h1>
      <p class="login__lead">Hvilken ønskeliste vil du se?</p>

      <!-- Én side per liste: bergen.html og sorumsand.html (på GitHub Pages også …/bergen og …/sorumsand) -->
      <nav class="login__form" aria-label="Ønskelister">
        <a class="btn btn--gold btn--block btn--lg" href="bergen" data-list>Bergen</a>
        <a class="btn btn--gold btn--block btn--lg" href="sorumsand" data-list>Sørumsand</a>
      </nav>
    </div>

    <p class="login__foot">Kun for familien</p>
  </section>

  <script>
    // Gamle lenker som …/#ellie tar med seg personen til listen som velges
    if (location.hash) {
      Array.prototype.forEach.call(document.querySelectorAll('a[data-list]'), function (a) {
        a.href = a.getAttribute('href') + location.hash;
      });
    }
  </script>
  <script src="assets/js/snow.js?v=21"></script>
  <script src="assets/js/effects.js?v=21"></script>
</body>
</html>
