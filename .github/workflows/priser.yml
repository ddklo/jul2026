# Henter laveste pris fra Prisjakt hver natt og lagrer den i data/<liste>/<person>.json.
# Kan også startes manuelt: «Run workflow» på GitHub, eller «Oppdater priser nå» i redigeringsverktøyet.
name: Oppdater priser

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC hver natt
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Samme gruppe som «Fyll inn manglende», så de ikke pusher samtidig
concurrency:
  group: data-jobber
  cancel-in-progress: false

jobs:
  priser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hent priser fra Prisjakt
        env:
          # Manuell kjøring skriver alltid, slik at «oppdatert»-datoen blir ny
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: node tools/priser.mjs $FORCE

      - name: Commit og publiser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then
            echo "Ingen endringer å publisere"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Oppdater priser fra Prisjakt"
          # Nettsiden kan ha lagret noe i mellomtiden
          git pull --rebase
          git push
          # Push med GITHUB_TOKEN starter ikke alltid Pages-bygget av seg selv
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Kunne ikke be om nytt Pages-bygg"
